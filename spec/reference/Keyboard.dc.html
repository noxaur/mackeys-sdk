      padY: M.padY,
      padW: M.padW,
      padH: M.padH,
      padShadow: '0 0 0 1px ' + f.edge + ', inset 0 0 0 1px rgba(0,0,0,' + (f.dark ? '.55' : '.13') + '), inset 0 2px 0 ' + f.edge,
      notch: 'linear-gradient(180deg, ' + f.lid[2] + ' 0%, ' + f.lid[1] + ' 60%, ' + f.lid[0] + ' 100%)',
      notchTop: M.H - 6,
      scoop: 'linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,' + (f.dark ? '.35' : '.10') + ') 100%)',
      aria: finishName + ' top case, ' + layoutName + ' keyboard',
