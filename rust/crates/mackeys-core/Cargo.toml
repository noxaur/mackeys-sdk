[package]
name = "mackeys-core"
description = "Engine of MacKeys: geometry, themes and state machines for interactive Mac keyboards and Force Touch trackpads."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"
include = ["src/**", "data/**", "build.rs", "Cargo.toml", "README.md"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
