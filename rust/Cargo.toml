[workspace]
resolver = "2"
members = ["crates/mackeys-core", "crates/mackeys-gpui"]

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/noxaur/mackeys-sdk"

[profile.dev.package."*"]
opt-level = 1

# The art pipeline (resvg, grain, lid projection) is slow without optimization.
[profile.dev.package.mackeys-gpui]
opt-level = 2
