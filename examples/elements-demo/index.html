<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MacKeys Web Components</title></head>
<body style="margin:0;font-family:system-ui">
  <div id="stage" style="min-height:100vh;box-sizing:border-box;padding:16px">
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;align-items:center">
      <label>Part <select id="part"><option value="mac-book">MacBook</option><option value="mac-keyboard">Keyboard</option><option value="mac-trackpad">Trackpad</option></select></label>
      <label>Finish <select id="finish"></select></label>
      <label>Layout <select id="layout"></select></label>
      <label>View <select id="view"><option value="top-down">Top-down</option><option value="angled">Angled</option></select></label>
      <label><input id="on" type="checkbox" checked /> Backlight</label>
      <label>Level <input id="level" type="range" min="0" max="16" value="12" /></label>
      <label>Room <select id="room"><option value="daylight">Daylight</option><option value="dark">Dark room</option></select></label>
      <span>Last key: <span id="last"></span></span>
    </div>
    <div id="device"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
